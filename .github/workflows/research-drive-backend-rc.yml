name: Research Drive backend release candidate

on:
  push:
    branches:
      - integration/research-drive-backend-release-candidate-20260828
      - integration/research-drive-backend-rc-refresh-20260904
      - agent/connected-accounts-20260829
      - agent/research-seed-convergence-20260829
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-drive-backend-rc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/kernel:${{ github.workspace }}/drive

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install release-candidate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas pyarrow pyyaml requests numpy python-dotenv pydantic fastapi starlette httpx

      - name: Compile composed authority modules
        run: |
          python -m py_compile \
            drive/scripts/research_data_mcp/gateway.py \
            drive/scripts/research_data_mcp/http_router.py \
            drive/scripts/research_data_mcp/research_seed.py \
            drive/scripts/research_data_mcp/research_seed_http.py \
            drive/scripts/research_data_mcp/tool_handlers.py \
            drive/scripts/research_data_mcp/craft_collect.py \
            drive/scripts/research_data_mcp/procurement_execution_contract.py \
            drive/scripts/research_data_mcp/procurement_chat.py \
            drive/scripts/research_data_mcp/procurement_chat_core.py \
            drive/scripts/research_data_mcp/synthesis_object_targets.py \
            drive/scripts/research_data_mcp/job_identity.py \
            drive/scripts/research_data_mcp/jobs.py \
            drive/scripts/research_data_mcp/discover_intent_store.py \
            drive/scripts/research_data_mcp/library_provenance.py \
            drive/scripts/research_data_mcp/registry_promotion.py \
            drive/scripts/research_data_mcp/library_possession.py \
            drive/scripts/research_data_mcp/library_retrieval.py \
            drive/scripts/research_data_mcp/library_semantic_search.py \
            drive/scripts/research_data_mcp/search.py \
            drive/scripts/research_data_mcp/semantic_index.py \
            drive/scripts/yzu_cluster/orchestrator.py \
            drive/scripts/yzu_cluster/executor.py
          python -m compileall -q drive/scripts/research_data_mcp/synthesis

      - name: Reprove frozen Synthesis authority
        run: |
          python -m pytest -q \
            drive/tests/test_synthesis_measurement_contract.py \
            drive/tests/test_synthesis_measurement_labels.py \
            drive/tests/test_synthesis_freeze_edges.py \
            drive/tests/test_synthesis_grain_freeze.py \
            tests/test_synthesis_preview_freeze_authority.py \
            tests/test_synthesis_preview_io_freeze.py \
            tests/test_synthesis_thread_state.py \
            tests/test_synthesis_method_export_contract.py \
            tests/test_synthesis_method_http_contract.py \
            tests/test_synthesis_object_targets.py

      - name: Reprove Discover procurement and lifecycle
        run: |
          python -m pytest -q \
            tests/test_procurement_execution_contract.py \
            tests/test_discover_submit_idempotency.py \
            tests/test_discover_procurement_submission_integration.py \
            tests/test_orchestrator_runtime.py \
            tests/test_job_identity_manifest.py \
            drive/tests/test_craft_collect.py

      - name: Reprove Library provenance and retrieval
        run: |
          python -m pytest -q \
            drive/tests/test_library_provenance.py \
            drive/tests/test_library_retrieval.py

      - name: Reprove principal seed convergence
        run: |
          python -m pytest -q \
            tests/test_connected_accounts.py \
            tests/test_connected_accounts_security.py \
            tests/test_research_seed.py

      - name: Enforce paired frontend HTTP contract
        run: python -m pytest -q tests/test_research_drive_frontend_contract.py

      - name: Cross-domain authority smoke
        run: |
          python -m pytest -q \
            tests/test_synthesis_thread_state.py \
            tests/test_synthesis_object_targets.py \
            tests/test_discover_procurement_submission_integration.py \
            tests/test_job_identity_manifest.py \
            drive/tests/test_library_provenance.py \
            drive/tests/test_library_retrieval.py
