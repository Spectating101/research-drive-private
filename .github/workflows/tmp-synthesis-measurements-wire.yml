name: Wire Synthesis measurements once
on:
  push:
    branches: [work/synthesis-bounded-preview-20260826]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/synthesis-bounded-preview-20260826
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install -q pytest pandas
      - name: Wire canonical read-only measurement route
        run: |
          python - <<'PY'
          from pathlib import Path

          router = Path('drive/scripts/research_data_mcp/http_router.py')
          text = router.read_text()
          route_anchor = '    {"method": "GET", "path": "/library/synthesis/threads/{thread_id}/materialisation", "handler": "library_synthesis_thread_materialisation"},\n'
          route_line = '    {"method": "GET", "path": "/library/synthesis/threads/{thread_id}/measurements", "handler": "library_synthesis_thread_measurements"},\n'
          if route_line not in text:
              if route_anchor not in text:
                  raise SystemExit('router route anchor missing')
              text = text.replace(route_anchor, route_line + route_anchor, 1)
          handler_anchor = '    def library_synthesis_thread_materialisation(stack, query, payload, params):\n        return stack.gateway.synthesis_thread_materialisation(params["thread_id"])\n'
          handler = '    def library_synthesis_thread_measurements(stack, query, payload, params):\n        return stack.gateway.synthesis_thread_measurements(\n            params["thread_id"], max_inputs=_query_int(query, "max_inputs", 8)\n        )\n\n'
          if handler not in text:
              if handler_anchor not in text:
                  raise SystemExit('router handler anchor missing')
              text = text.replace(handler_anchor, handler + handler_anchor, 1)
          router.write_text(text)

          gateway = Path('drive/scripts/research_data_mcp/gateway.py')
          text = gateway.read_text()
          anchor = '    def synthesis_thread_materialisation(self, thread_id: str) -> dict:\n        return self._synthesis_thread_store().materialisation(thread_id)\n'
          method = '''    def synthesis_thread_measurements(self, thread_id: str, *, max_inputs: int = 8) -> dict:\n        from scripts.research_data_mcp.synthesis.thread_measurements import measure_thread\n\n        thread = self._synthesis_thread_store().get(thread_id)\n        return measure_thread(self.repo_root, thread, max_inputs=max_inputs)\n\n'''
          if method not in text:
              if anchor not in text:
                  raise SystemExit('gateway anchor missing')
              text = text.replace(anchor, method + anchor, 1)
          gateway.write_text(text)
          PY
      - name: Test measurement contract
        run: |
          python -m compileall -q drive/scripts/research_data_mcp/synthesis drive/scripts/research_data_mcp/gateway.py drive/scripts/research_data_mcp/http_router.py
          python -m pytest -q tests/test_multi_probe.py tests/test_thread_measurements.py
      - name: Commit product patch and remove one-shot workflow
        run: |
          git config user.name 'spectating101'
          git config user.email 's1133958@mail.yzu.edu.tw'
          git rm .github/workflows/tmp-synthesis-measurements-wire.yml
          git add drive/scripts/research_data_mcp/http_router.py drive/scripts/research_data_mcp/gateway.py
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
            exit 0
          fi
          git commit -m 'feat(synthesis): expose measured thread evidence'
          git push origin HEAD:work/synthesis-bounded-preview-20260826
