name: Synthesis method checksum lint fix

on:
  push:
    branches:
      - hardening/synthesis-measurement-contract-20260826
    paths:
      - tools/_tmp_synthesis_hashlib_import.py
      - .github/workflows/synthesis-method-export-lint-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/synthesis-measurement-contract-20260826
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused checks
        run: python -m pip install ruff pytest pandas pyarrow numpy
      - name: Apply guarded import fix
        run: python tools/_tmp_synthesis_hashlib_import.py
      - name: Lint exact touched backend
        run: python -m ruff check drive/scripts/research_data_mcp/gateway.py --select E9,F63,F7,F82
      - name: Compile and test frozen-method contract
        run: |
          python -m py_compile drive/scripts/research_data_mcp/gateway.py
          pytest -q tests/test_synthesis_method_export_contract.py tests/test_export_fidelity.py tests/test_export_runtime_parity.py tests/test_export_join_fidelity.py
      - name: Commit verified fix and self-clean
        run: |
          rm -f tools/_tmp_synthesis_hashlib_import.py .github/workflows/synthesis-method-export-lint-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(synthesis): import checksum verifier"
          git push origin HEAD:hardening/synthesis-measurement-contract-20260826
