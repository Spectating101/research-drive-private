name: Library research package certification

on:
  push:
    branches:
      - hardening/library-research-packages-20260828
  pull_request:
    branches:
      - hardening/discover-release-candidate-20260827
    paths:
      - "drive/scripts/research_data_mcp/library_packages.py"
      - "drive/scripts/research_data_mcp/library_package_http.py"
      - "drive/scripts/research_query_engine/server.py"
      - "tests/test_library_packages.py"
      - "tests/test_library_package_http.py"
      - ".github/workflows/library-package-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-parent-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/kernel:${{ github.workspace }}/drive

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas pyarrow pyyaml requests numpy python-dotenv pydantic

      - name: Compile package and inherited authority
        run: |
          python -m py_compile \
            drive/scripts/research_data_mcp/library_packages.py \
            drive/scripts/research_data_mcp/library_package_http.py \
            drive/scripts/research_data_mcp/craft_collect.py \
            drive/scripts/research_data_mcp/procurement_execution_contract.py \
            drive/scripts/research_data_mcp/jobs.py \
            drive/scripts/research_data_mcp/discover_intent_store.py \
            drive/scripts/yzu_cluster/orchestrator.py

      - name: Prove Library package authority and HTTP boundary
        run: |
          python -m pytest -q \
            tests/test_library_packages.py \
            tests/test_library_package_http.py

      - name: Reprove procurement compiler contract
        run: |
          python -m pytest -q \
            tests/test_procurement_execution_contract.py \
            drive/tests/test_craft_collect.py

      - name: Reprove durable Discover submit contract
        run: python -m pytest -q tests/test_discover_submit_idempotency.py

      - name: Reprove compiler-to-submit composition
        run: python -m pytest -q tests/test_discover_procurement_submission_integration.py

      - name: Reprove durable orchestrator idempotency
        run: python -m pytest -q tests/test_orchestrator_runtime.py
