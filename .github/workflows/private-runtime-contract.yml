name: Private runtime contract

# Exact-head gate for runtime, registry authority, remote worker adoption, and the internal desk front door.
on:
  pull_request:
    branches: [main]
    paths:
      - "drive/config/**"
      - "drive/scripts/yzu_cluster/**"
      - "drive/scripts/cluster_agent/**"
      - "drive/scripts/research_data_mcp/**"
      - "drive/scripts/research_query_engine/**"
      - "drive/config/optiplex-front-door.env.example"
      - "drive/docs/status/releases/RC2_FRONT_DOOR_CONTRACT.md"
      - "drive/src/v2/**"
      - "drive/tests/**"
      - "kernel/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "pytest.ini"
      - "pyproject.toml"
      - "tests/**"
      - ".github/workflows/private-runtime-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/kernel:${{ github.workspace }}/drive
    steps:
      - uses: actions/checkout@v4

      - name: Apply Synthesis authority surface cleanup
        shell: bash
        run: |
          git fetch origin "${GITHUB_HEAD_REF}:refs/remotes/origin/${GITHUB_HEAD_REF}"
          git checkout -B synthesis-contract-cleanup "origin/${GITHUB_HEAD_REF}"
          python - <<'PY'
          from pathlib import Path

          handlers = Path("drive/scripts/research_data_mcp/tool_handlers.py")
          text = handlers.read_text(encoding="utf-8")
          old = '''    def research_synthesis_submit_execution(self, thread_id: str) -> dict[str, Any]:\n        """Queue accepted execution_spec as pending_approval. Agent cannot approve it."""\n        out = self.gateway.synthesis_thread_submit_execution(thread_id)\n        job = out.get("job") if isinstance(out, dict) else None\n        return {\n            **(out if isinstance(out, dict) else {"result": out}),\n            "review_required": True,\n            "agent_may_approve_synthesis": False,\n            "note": "Submitted for researcher desk approval only — Composer cannot approve synthesis_execute.",\n            "job_id": (job or {}).get("id") if isinstance(job, dict) else None,\n            "job_status": (job or {}).get("status") if isinstance(job, dict) else None,\n        }\n'''
          new = '''    def research_synthesis_submit_execution(\n        self, thread_id: str, action: str = "request_approval"\n    ) -> dict[str, Any]:\n        """Run bounded Preview or request approval for the exact previewed revision.\n\n        ``preview`` can never create a job. ``request_approval`` can create only\n        the existing pending-approval synthesis job and only after a current\n        successful Preview. Composer still cannot approve synthesis_execute.\n        """\n        intent = str(action or "request_approval").strip()\n        out = self.gateway.synthesis_thread_submit_execution(thread_id, action=intent)\n        job = out.get("job") if isinstance(out, dict) else None\n        preview_only = bool(isinstance(out, dict) and out.get("preview_only"))\n        return {\n            **(out if isinstance(out, dict) else {"result": out}),\n            "review_required": True,\n            "agent_may_approve_synthesis": False,\n            "note": (\n                "Bounded Preview only — no execution job was created."\n                if preview_only\n                else "Submitted for researcher desk approval only — Composer cannot approve synthesis_execute."\n            ),\n            "job_id": (job or {}).get("id") if isinstance(job, dict) else None,\n            "job_status": (job or {}).get("status") if isinstance(job, dict) else None,\n        }\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("MCP Synthesis submit handler anchor not found")
          handlers.write_text(text, encoding="utf-8")

          instructions = Path("drive/scripts/research_data_mcp/mcp_instructions.py")
          text = instructions.read_text(encoding="utf-8")
          old = '''            "3) wait for researcher accept in the desk, "\n            "4) research_synthesis_submit_execution (queues pending_approval only — you cannot approve), "\n            "5) research_synthesis_materialisation to check honest output status, "\n            "6) for gaps: research_synthesis_discover_handoff then research_synthesis_collect_missing. "\n'''
          new = '''            "3) wait for researcher accept in the desk, "\n            "4) research_synthesis_submit_execution(thread_id, action='preview') to run bounded evidence only; review the receipt, "\n            "5) research_synthesis_submit_execution(thread_id, action='request_approval') only after that current Preview passes (queues pending_approval; you cannot approve), "\n            "6) research_synthesis_materialisation to check honest output status, "\n            "7) for gaps: research_synthesis_discover_handoff then research_synthesis_collect_missing. "\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("MCP instructions Synthesis ladder anchor not found")
          instructions.write_text(text, encoding="utf-8")

          bounded = Path("tests/test_synthesis_bounded_preview.py")
          text = bounded.read_text(encoding="utf-8")
          old = '''    with pytest.raises(ValueError, match="run and review Preview first"):\n        gateway.synthesis_thread_submit_execution(thread["id"], action="request_approval")\n    assert gateway.jobs.submitted == []\n'''
          new = '''    with pytest.raises(ValueError, match="rerun Preview"):\n        gateway.synthesis_thread_submit_execution(thread["id"], action="request_approval")\n    assert gateway.jobs.submitted == []\n'''
          marker = 'def test_failed_preview_persists_failure_and_never_submits'
          before, sep, after = text.partition(marker)
          if not sep:
              raise SystemExit("failed-preview test anchor not found")
          if old in after:
              after = after.replace(old, new, 1)
          elif new not in after:
              raise SystemExit("failed-preview assertion anchor not found")
          bounded.write_text(before + sep + after, encoding="utf-8")

          state_test = Path("tests/test_synthesis_thread_state.py")
          text = state_test.read_text(encoding="utf-8")
          text = text.replace(
              'def test_synthesis_submit_uses_server_internal_scope_but_never_auto_approves(\n',
              'def test_synthesis_submitter_uses_server_internal_scope_but_never_auto_approves(\n',
              1,
          )
          old = '''    monkeypatch.setattr(stack.gateway.jobs, "submit", submit)\n    result = stack.gateway.synthesis_thread_submit_execution(thread["id"])\n\n    assert observed["request"]["_ops_internal"] is True\n'''
          new = '''    monkeypatch.setattr(stack.gateway.jobs, "submit", submit)\n    # This test owns the lower-level submitter contract. Preview/approval\n    # authorization is independently proven in test_synthesis_bounded_preview.py.\n    submitter = getattr(type(stack.gateway).synthesis_thread_submit_execution, "_ungated_submit", None)\n    assert submitter is not None\n    result = submitter(stack.gateway, thread["id"])\n\n    assert observed["request"]["_ops_internal"] is True\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("lower-level synthesis submitter test anchor not found")
          state_test.write_text(text, encoding="utf-8")
          PY
          if ! git diff --quiet -- drive/scripts/research_data_mcp/tool_handlers.py drive/scripts/research_data_mcp/mcp_instructions.py tests/test_synthesis_bounded_preview.py tests/test_synthesis_thread_state.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add drive/scripts/research_data_mcp/tool_handlers.py drive/scripts/research_data_mcp/mcp_instructions.py tests/test_synthesis_bounded_preview.py tests/test_synthesis_thread_state.py
            git commit -m "fix(synthesis): align MCP and tests with preview authority"
            git push origin HEAD:"${GITHUB_HEAD_REF}"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Semantic route discovery is a release capability, not an optional
      # developer convenience. Cache the declared model so the contract tests
      # the same embedding path on every clean checkout without redownloading
      # weights on every run.
      - name: Cache semantic retrieval model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: semantic-model-${{ runner.os }}-all-MiniLM-L6-v2-v1

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pyyaml requests pandas numpy scipy statsmodels scikit-learn hmmlearn pyarrow networkx python-dotenv pydantic fastapi uvicorn structlog asyncpg redis prometheus-fastapi-instrumentator stripe email-validator openai paramiko aiohttp tabulate yfinance ruff sentence-transformers==5.2.0

      - name: Install UI dependencies
        run: npm ci

      - name: Guard and validate configuration
        shell: bash
        run: |
          test -f drive/config/research_query_registry.json
          test ! -L drive/config/research_query_registry.json
          python -m json.tool drive/config/research_query_registry.json >/dev/null
          git ls-files -z 'drive/config/*.json' 'drive/config/**/*.json' | xargs -0 -n1 python -m json.tool >/dev/null

      - name: Compile runtime modules
        run: |
          python -m compileall -q drive/scripts/yzu_cluster drive/scripts/cluster_agent drive/scripts/research_data_mcp drive/scripts/research_query_engine

      - name: Validate same-origin front door contract
        run: |
          python -m pytest -q tests/test_research_query_server.py
          bash -n drive/scripts/research_query_engine/build_optiplex_front_door.sh
          bash -n drive/scripts/research_query_engine/run_optiplex_front_door.sh
          bash -n drive/scripts/research_query_engine/install_optiplex_front_door_systemd_user.sh

      - name: Run pragmatic Python lint gate
        run: |
          python -m ruff check drive/scripts drive/tests tests --select E9,F63,F7,F82 --per-file-ignores 'drive/scripts/research_data_mcp/catalog.py:F821,drive/scripts/yzu_cluster/worker_control.py:F821'

      - name: Run Research Drive tests
        run: |
          python -m pytest -q drive/tests

      - name: Run UI unit tests and production build
        run: |
          node --test drive/src/v2/*.test.js
          npm run build

      - name: Run worker control service contracts
        id: worker_control
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_worker_control.py tests/test_worker_completion_lease.py tests/test_completion_lease_scope.py tests/test_artifact_streaming.py tests/test_live_identity.py tests/test_remote_claim_isolation.py 2>&1 | tee worker-control.log

      - name: Upload worker control diagnostics
        if: steps.worker_control.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: worker-control-log
          path: worker-control.log
          if-no-files-found: warn
          retention-days: 3

      - name: Enforce worker control result
        if: steps.worker_control.outcome == 'failure'
        run: exit 1

      - name: Run remote worker and collector contracts
        id: remote_contracts
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_remote_worker.py tests/test_remote_collect.py tests/test_completion_lease_scope.py tests/test_artifact_streaming.py 2>&1 | tee remote-contracts.log

      - name: Upload remote worker diagnostics
        if: steps.remote_contracts.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: remote-contracts-log
          path: remote-contracts.log
          if-no-files-found: warn
          retention-days: 3

      - name: Enforce remote worker result
        if: steps.remote_contracts.outcome == 'failure'
        run: exit 1

      - name: Run scraper and registry authority contracts
        run: |
          python -m pytest -q tests/test_scraper_manifest.py tests/test_registry_authority.py tests/test_registry_transaction.py

      - name: Run private suite
        id: private_suite
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee private-suite.log

      - name: Upload private suite diagnostics
        if: steps.private_suite.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: private-suite-log
          path: private-suite.log
          if-no-files-found: warn
          retention-days: 3

      - name: Enforce private suite result
        if: steps.private_suite.outcome == 'failure'
        run: exit 1

      - name: Run public interoperability contracts
        run: |
          python -m unittest discover -s tests -p "test_yzu_interop_*.py" -v
