name: Private runtime contract

# Exact-head gate for runtime, registry authority, and remote worker adoption.
on:
  pull_request:
    branches: [main]
    paths:
      - "drive/config/**"
      - "drive/scripts/yzu_cluster/**"
      - "drive/scripts/research_data_mcp/**"
      - "drive/scripts/research_query_engine/**"
      - "drive/src/v2/**"
      - "drive/tests/**"
      - "kernel/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "pytest.ini"
      - "pyproject.toml"
      - "tests/**"
      - ".github/workflows/private-runtime-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/kernel:${{ github.workspace }}/drive
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pyyaml requests pandas numpy scipy statsmodels scikit-learn pyarrow networkx python-dotenv pydantic fastapi uvicorn structlog asyncpg redis prometheus-fastapi-instrumentator stripe email-validator openai paramiko aiohttp tabulate yfinance ruff

      - name: Install UI dependencies
        run: npm ci

      - name: Guard and validate configuration
        shell: bash
        run: |
          test -f drive/config/research_query_registry.json
          test ! -L drive/config/research_query_registry.json
          python -m json.tool drive/config/research_query_registry.json >/dev/null
          git ls-files -z 'drive/config/*.json' 'drive/config/**/*.json' | xargs -0 -n1 python -m json.tool >/dev/null

      - name: Compile runtime modules
        run: |
          python -m compileall -q drive/scripts/yzu_cluster drive/scripts/research_data_mcp drive/scripts/research_query_engine

      - name: Run pragmatic Python lint gate
        run: |
          python -m ruff check drive/scripts drive/tests tests --select E9,F63,F7,F82 --per-file-ignores 'drive/scripts/research_data_mcp/catalog.py:F821,drive/scripts/yzu_cluster/worker_control.py:F821'

      - name: Run Research Drive tests
        run: |
          python -m pytest -q drive/tests

      - name: Run UI unit tests and production build
        run: |
          node --test drive/src/v2/*.test.js
          npm run build

      - name: Run worker control service contracts
        id: worker_control
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_worker_control.py tests/test_worker_completion_lease.py tests/test_completion_lease_scope.py tests/test_artifact_streaming.py 2>&1 | tee worker-control.log

      - name: Upload worker control diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-control-log
          path: worker-control.log
          if-no-files-found: error
          retention-days: 3

      - name: Enforce worker control result
        if: steps.worker_control.outcome == 'failure'
        run: exit 1

      - name: Run remote worker agent contracts
        run: |
          python -m pytest -q tests/test_remote_worker.py tests/test_completion_lease_scope.py tests/test_artifact_streaming.py

      - name: Run scraper and registry authority contracts
        run: |
          python -m pytest -q tests/test_scraper_manifest.py tests/test_registry_authority.py tests/test_registry_transaction.py

      - name: Run private suite excluding optional HMM tests
        id: private_suite
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -k "not strategy_regime_hmm" 2>&1 | tee private-suite.log

      - name: Upload private suite diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-suite-log
          path: private-suite.log
          if-no-files-found: error
          retention-days: 3

      - name: Enforce private suite result
        if: steps.private_suite.outcome == 'failure'
        run: exit 1

      - name: Run public interoperability contracts
        run: |
          python -m unittest discover -s tests -p "test_yzu_interop_*.py" -v
