name: Connected accounts contracts

on:
  push:
    branches:
      - agent/connected-accounts-20260829
    paths:
      - "drive/scripts/research_data_mcp/connected_accounts.py"
      - "drive/scripts/research_data_mcp/connected_accounts_http.py"
      - "drive/scripts/research_data_mcp/http_router.py"
      - "drive/scripts/research_data_mcp/http_router_legacy.py"
      - "tests/test_connected_accounts.py"
      - ".github/workflows/connected-accounts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/kernel:${{ github.workspace }}/drive

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install contract dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas pyarrow pyyaml requests numpy python-dotenv pydantic fastapi starlette httpx

      - name: Compile connected-account authority
        run: |
          python -m py_compile \
            drive/scripts/research_data_mcp/connected_accounts.py \
            drive/scripts/research_data_mcp/connected_accounts_http.py \
            drive/scripts/research_data_mcp/http_router.py \
            drive/scripts/research_data_mcp/http_router_legacy.py

      - name: Prove principal isolation and OAuth contracts
        run: python -m pytest -q tests/test_connected_accounts.py
