name: Discover release candidate

on:
  push:
    branches:
      - hardening/discover-release-candidate-20260827
  pull_request:
    branches:
      - live/deployed-backend-20260825
    paths:
      - "drive/scripts/research_data_mcp/craft_collect.py"
      - "drive/scripts/research_data_mcp/procurement_execution_contract.py"
      - "drive/scripts/research_data_mcp/jobs.py"
      - "drive/scripts/research_data_mcp/discover_intent_store.py"
      - "tests/test_procurement_execution_contract.py"
      - "tests/test_discover_submit_idempotency.py"
      - "tests/test_discover_procurement_submission_integration.py"
      - "tests/test_orchestrator_runtime.py"
      - "drive/tests/test_craft_collect.py"
      - ".github/workflows/discover-release-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/kernel:${{ github.workspace }}/drive

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas pyarrow pyyaml requests numpy python-dotenv pydantic

      - name: Compile integrated Discover authority
        run: |
          python -m py_compile \
            drive/scripts/research_data_mcp/craft_collect.py \
            drive/scripts/research_data_mcp/procurement_execution_contract.py \
            drive/scripts/research_data_mcp/jobs.py \
            drive/scripts/research_data_mcp/discover_intent_store.py \
            drive/scripts/yzu_cluster/orchestrator.py

      - name: Prove procurement compiler contract
        run: |
          python -m pytest -q \
            tests/test_procurement_execution_contract.py \
            drive/tests/test_craft_collect.py

      - name: Prove durable Discover submit contract
        run: |
          python -m pytest -q tests/test_discover_submit_idempotency.py

      - name: Prove compiler-to-submit composition
        run: |
          python -m pytest -q tests/test_discover_procurement_submission_integration.py

      - name: Reprove durable orchestrator idempotency
        run: |
          python -m pytest -q tests/test_orchestrator_runtime.py
