name: Discover procurement compiler deployed certification

on:
  push:
    branches:
      - hardening/discover-procurement-compiler-deployed-20260827

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/drive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/discover-procurement-compiler-deployed-20260827
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test runner
        run: python -m pip install pytest
      - name: Prove procurement compiler contract
        run: pytest -q tests/test_procurement_execution_contract.py
      - name: Preserve generic craft contracts
        run: pytest -q drive/tests/test_craft_collect.py
      - name: Prove cluster resource placement
        run: pytest -q tests/test_yzu_interop_resources.py tests/test_yzu_interop_reliability.py
      - name: Compile touched Python
        run: python -m py_compile drive/scripts/research_data_mcp/procurement_execution_contract.py drive/scripts/research_data_mcp/craft_collect.py
      - name: Prove exact deployed lineage
        shell: bash
        run: |
          git merge-base --is-ancestor 687529d7a9c7963e65b7d0e306467187417ac8c7 HEAD
          test "$(git rev-list --count 687529d7a9c7963e65b7d0e306467187417ac8c7..HEAD)" -eq 2
          git diff --check 687529d7a9c7963e65b7d0e306467187417ac8c7..HEAD
