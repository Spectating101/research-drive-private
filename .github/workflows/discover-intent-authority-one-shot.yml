name: Discover intent authority one shot

on:
  push:
    branches:
      - hardening/discover-submit-idempotency-20260827

permissions:
  contents: write

jobs:
  harden:
    if: contains(github.event.head_commit.message, '[discover-intent-authority]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/kernel:${{ github.workspace }}/drive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/discover-submit-idempotency-20260827
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pyyaml requests pandas numpy scipy statsmodels scikit-learn pyarrow networkx python-dotenv pydantic fastapi structlog aiohttp tabulate ruff
      - name: Apply transactional intent authority hardening
        run: |
          python .github/scripts/discover_intent_authority_harden.py
          python .github/scripts/discover_intent_authority_postpatch.py
          python .github/scripts/discover_intent_authority_v2.py
      - name: Compile touched runtime
        run: python -m compileall -q drive/scripts/research_data_mcp
      - name: Lint touched runtime
        run: >-
          python -m ruff check
          drive/scripts/research_data_mcp/discover_intent_store.py
          drive/scripts/research_data_mcp/gateway.py
          tests/test_discover_intent_authority_races.py
          tests/test_discover_submit_idempotency.py
          --select E9,F63,F7,F82
      - name: Prove authority races
        run: python -m pytest -q tests/test_discover_intent_authority_races.py tests/test_discover_submit_idempotency.py
      - name: Preserve full Discover backend contract family
        run: >-
          python -m pytest -q
          tests/test_discover*.py
          drive/tests/test_discover_collect_plan.py
          drive/tests/test_craft_collect.py
          tests/test_acquisition_handoff.py
      - name: Re-prove queue idempotency
        run: python -m pytest -q tests/test_orchestrator_runtime.py -k 'idempotent or concurrent_identical_submission'
      - name: Commit authority hardening
        run: |
          git config user.name "discover-hardening-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drive/scripts/research_data_mcp/discover_intent_store.py \
                  drive/scripts/research_data_mcp/gateway.py
          git commit -m "hardening(discover): make intent transitions atomic"
          git push origin HEAD:hardening/discover-submit-idempotency-20260827
