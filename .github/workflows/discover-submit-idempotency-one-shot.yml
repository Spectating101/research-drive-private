name: Discover submit idempotency one shot

on:
  push:
    branches:
      - hardening/discover-submit-idempotency-20260827

permissions:
  contents: write

jobs:
  harden:
    if: contains(github.event.head_commit.message, '[discover-submit-idempotency]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/kernel:${{ github.workspace }}/drive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/discover-submit-idempotency-20260827
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pyyaml requests pandas numpy scipy statsmodels scikit-learn pyarrow networkx python-dotenv pydantic fastapi structlog aiohttp tabulate ruff
      - name: Apply guarded Discover submit patch
        run: python .github/scripts/discover_submit_idempotency_patch.py
      - name: Compile touched runtime
        run: python -m compileall -q drive/scripts/research_data_mcp drive/scripts/yzu_cluster
      - name: Lint touched runtime
        run: python -m ruff check drive/scripts/research_data_mcp/discover_intent_store.py drive/scripts/research_data_mcp/gateway.py tests/test_discover_submit_idempotency.py --select E9,F63,F7,F82
      - name: Prove Discover intent idempotency
        run: python -m pytest -q tests/test_discover_submit_idempotency.py
      - name: Re-prove atomic queue idempotency primitive
        run: python -m pytest -q tests/test_orchestrator_runtime.py -k 'idempotent or concurrent_identical_submission'
      - name: Preserve acquisition-plan resolution
        run: python -m pytest -q drive/tests/test_discover_collect_plan.py
      - name: Commit backend hardening
        run: |
          git config user.name "discover-hardening-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drive/scripts/research_data_mcp/discover_intent_store.py \
                  drive/scripts/research_data_mcp/gateway.py \
                  tests/test_discover_submit_idempotency.py
          git commit -m "hardening(discover): make acquisition submission idempotent"
          git push origin HEAD:hardening/discover-submit-idempotency-20260827
