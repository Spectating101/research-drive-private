name: Synthesis method HTTP freeze proof

on:
  push:
    branches:
      - hardening/synthesis-measurement-contract-20260826
    paths:
      - "tools/_tmp_synthesis_method_http_freeze.py"
      - ".github/workflows/synthesis-method-http-freeze.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/drive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/synthesis-measurement-contract-20260826
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply guarded final HTTP patch
        run: python tools/_tmp_synthesis_method_http_freeze.py
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas pyarrow
      - name: Compile touched authority surface
        run: |
          python -m compileall -q \
            drive/scripts/research_data_mcp/http_router.py \
            drive/scripts/research_data_mcp/gateway.py \
            tests/test_synthesis_method_http_contract.py \
            tests/test_synthesis_method_export_contract.py
      - name: Prove real HTTP dispatch, anti-spoof, tamper rejection, and executable parity
        run: |
          python -m pytest -q \
            tests/test_synthesis_method_http_contract.py \
            tests/test_synthesis_method_export_contract.py
      - name: Commit verified product and tests, remove temporary machinery
        run: |
          rm tools/_tmp_synthesis_method_http_freeze.py
          rm .github/workflows/synthesis-method-http-freeze.yml
          git config user.name "spectating101"
          git config user.email "s1133958@mail.yzu.edu.tw"
          git add -A
          git commit -m "fix(synthesis): close frozen method HTTP provenance contract"
          git push origin HEAD:hardening/synthesis-measurement-contract-20260826
