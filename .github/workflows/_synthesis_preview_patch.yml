    ) -> dict:
        """Run and persist a non-materialising preview of the accepted spec."""
        from datetime import datetime, timezone
        from scripts.research_data_mcp.synthesis_preview import run_bounded_preview

        thread = self._synthesis_thread_store().get(thread_id)
        state = thread.get("state") or {}
        spec = dict(state.get("execution_spec") or {})
        accepted_hash = str(state.get("accepted_spec_hash") or "")
        if not spec or not accepted_hash:
            raise ValueError("preview requires an accepted execution spec")
        current = state.get("preview") or {}
        if (
            not force
            and current.get("status") == "succeeded"
            and current.get("spec_hash") == accepted_hash
            and int((current.get("sampling") or {}).get("input_row_limit") or 0) == int(input_row_limit or 5_000)
        ):
            return {"thread": thread, "preview": current, "idempotent": True}
        try:
            receipt = run_bounded_preview(
                Path(self.repo_root),
                spec,
                input_row_limit=input_row_limit,
                output_row_limit=output_row_limit,
            )
            if receipt.get("spec_hash") != accepted_hash:
                raise ValueError("preview executor normalized to a different accepted spec revision")
        except Exception as exc:  # noqa: BLE001
            receipt = {
                "status": "failed",
                "created_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
                "spec_hash": accepted_hash,
                "bounded": True,
                "error": str(exc)[:2000],
                "materialised": False,
                "registered": False,
                "review_required": True,
            }
        updated = self._synthesis_thread_store().record_preview(
            thread_id,
            receipt,
            spec_hash=accepted_hash,
        )
        return {
            "thread": updated,
            "preview": (updated.get("state") or {}).get("preview") or receipt,
            "idempotent": False,
        }

