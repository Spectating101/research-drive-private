name: Sol live review

on:
  workflow_dispatch:
  push:
    branches:
      - sol/live-review
    paths:
      - ".github/workflows/sol-live-review.yml"
      - "playwright.live-review.config.js"
      - "e2e/live-review.spec.js"
      - "package.json"
  pull_request:
    branches:
      - sol/live-review-base
    paths:
      - ".github/workflows/sol-live-review.yml"
      - "playwright.live-review.config.js"
      - "e2e/live-review.spec.js"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: sol-live-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Read-only Chromium review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YZU_DESK_URL: https://previous.easycamp.tech
      LIVE_REVIEW_QUERY: stablecoin
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Confirm public endpoint
        run: |
          curl --fail --show-error --location --max-time 30 https://previous.easycamp.tech/ >/dev/null

      - name: Run read-only live review
        run: npm run test:live-review

      - name: Upload live-review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-live-review-${{ github.run_id }}
          path: |
            artifacts/live-review/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
