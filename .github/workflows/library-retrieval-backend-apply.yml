name: Library retrieval backend apply

on:
  push:
    branches:
      - hardening/library-retrieval-excellence-20260828

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[retrieval-backend-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/kernel:${{ github.workspace }}/drive
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install offline test dependencies
        run: python -m pip install pytest pandas pyarrow
      - name: Apply retrieval backend integration
        run: python scripts/apply_library_retrieval_backend.py
      - name: Compile retrieval modules
        run: python -m compileall -q drive/scripts/research_data_mcp drive/scripts/research_query_engine
      - name: Run Library retrieval contract
        run: python -m pytest -q drive/tests/test_library_retrieval.py
      - name: Run existing retrieval and semantic gates
        run: python -m pytest -q drive/tests/test_semantic_relevance_gate.py drive/tests/test_search_warmup_wired.py tests/test_retrieval_paths_are_reachable.py
      - name: Run broad Research Drive offline suite
        run: python -m pytest -q drive/tests -k 'not test_every_registry_partitioned_row_is_listed_in_a_collection_partition'
      - name: Commit applied slice
        run: |
          git config user.name spectating101
          git config user.email s1133958@mail.yzu.edu.tw
          git add drive/scripts/research_query_engine/engine.py drive/scripts/research_data_mcp/search.py drive/scripts/research_data_mcp/tool_handlers.py drive/scripts/research_data_mcp/semantic_index.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(library): make registry retrieval evidence-aware [retrieval-backend-applied]'
          git push origin HEAD:hardening/library-retrieval-excellence-20260828
