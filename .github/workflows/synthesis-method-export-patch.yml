name: Synthesis frozen method export patch

on:
  push:
    branches:
      - hardening/synthesis-measurement-contract-20260826
    paths:
      - tools/_tmp_synthesis_method_export_patch.py
      - .github/workflows/synthesis-method-export-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/synthesis-measurement-contract-20260826
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyarrow pytest numpy
      - name: Apply guarded patch
        run: python tools/_tmp_synthesis_method_export_patch.py
      - name: Compile touched backend modules
        run: |
          python -m py_compile \
            drive/scripts/research_data_mcp/synthesis_executor.py \
            drive/scripts/research_data_mcp/synthesis/spec_export.py \
            drive/scripts/research_data_mcp/synthesis_thread_store.py \
            drive/scripts/research_data_mcp/gateway.py \
            drive/scripts/research_data_mcp/http_router.py \
            drive/scripts/research_data_mcp/tool_handlers.py
      - name: Test frozen method and export parity
        run: |
          pytest -q \
            tests/test_synthesis_method_export_contract.py \
            tests/test_spec_export.py \
            tests/test_export_fidelity.py \
            tests/test_export_runtime_parity.py \
            tests/test_export_join_fidelity.py
      - name: Commit verified product changes and self-clean
        run: |
          rm -f tools/_tmp_synthesis_method_export_patch.py .github/workflows/synthesis-method-export-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(synthesis): freeze reproducible method artifact"
          git push origin HEAD:hardening/synthesis-measurement-contract-20260826
