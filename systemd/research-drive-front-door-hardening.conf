# Install as:
#   ~/.config/systemd/user/research-drive-front-door.service.d/20-hardening.conf
#
# This keeps the desk's required access to research files, /proc-backed resource
# truth, and outbound research connectors while removing kernel, device-family,
# capability, and executable-format authority the front door does not need.
[Service]
CapabilityBoundingSet=
LockPersonality=true
ProtectClock=true
ProtectControlGroups=true
ProtectHostname=true
ProtectKernelLogs=true
ProtectKernelModules=true
ProtectKernelTunables=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictRealtime=true
RestrictSUIDSGID=true
SystemCallArchitectures=native
UMask=0027
